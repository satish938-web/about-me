services:
  - type: web
    name: portfolio-ai
    runtime: python
    plan: free
    buildCommand: pip install -r backend/python/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend/python --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
